services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-60000:50000-60000/udp"
    expose:
      - "7880"
    networks:
      - kenz-live

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3479
      - --tls-listening-port=5350
      - --realm=${TURN_HOST}
      - --server-name=${TURN_HOST}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --cert=/etc/letsencrypt/live/${TURN_HOST}/fullchain.pem
      - --pkey=/etc/letsencrypt/live/${TURN_HOST}/privkey.pem
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kenz-live

networks:
  kenz-live:

volumes:
  caddy_data:
  caddy_config:
