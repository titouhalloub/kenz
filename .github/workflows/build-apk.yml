name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          # PR builds package the branch head itself, not the synthetic PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record source identity
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" | tee source-build.txt
          echo "EVENT=${{ github.event_name }}" | tee -a source-build.txt
          echo "REF=${{ github.ref }}" | tee -a source-build.txt

      # Capacitor CLI requires Node >= 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qxbmrqxxqeoyezebftux.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_keVgMBUk932fZ24ydmvsyA_C3W2dQv4' }}
        run: |
          npm run build
          test -s dist/index.html
          find dist/assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | tee dist-assets-sha256.txt
          cat source-build.txt

      # android/app/capacitor.build.gradle uses JavaVersion.VERSION_21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true

      - name: Create local.properties for Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html
          sha256sum android/app/src/main/assets/public/index.html
          cmp dist/index.html android/app/src/main/assets/public/index.html

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenz-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            source-build.txt
            dist-assets-sha256.txt
          if-no-files-found: error
